name: Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wrapper:
    name: Wrapper runs and stops where it should
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write a suite
        run: |
          cat > drengr-tests.yml <<'YAML'
          app: com.example.app
          tasks:
            - name: Smoke
              task: Open the app
              timeout: 30s
          YAML

      - id: act
        continue-on-error: true
        uses: ./
        with:
          format: junit

      - name: Assert
        run: |
          drengr --version
          set +e
          drengr test --format junit --output /tmp/out.xml
          code=$?
          set -e
          echo "drengr test exit=$code (2 = no API key, reached before device detection)"
          [ "$code" -eq 2 ]
          [ "${{ steps.act.outcome }}" = "failure" ]

  device-android:
    name: Boots its own Android emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write a suite
        run: |
          cat > drengr-tests.yml <<'YAML'
          app: com.android.settings
          tasks:
            - name: Smoke
              task: Open the app
              timeout: 30s
          YAML

      # No API key on purpose: this job proves the device half, which is the part
      # the action never did. Exit 2 means it reached the model, so a device was
      # already resolved before it stopped.
      - id: act
        continue-on-error: true
        uses: ./
        with:
          format: junit

      # Assert on adb's own device table, never on Drengr's prose: the string
      # "No devices found" contains both "device" and "emulator", so a loose
      # grep over that output passes while nothing booted.
      - name: A device must exist
        run: |
          adb devices
          adb devices | awk 'NR>1 && $2=="device" {found=1} END {exit !found}' \
            || { echo "no device was provisioned"; exit 1; }
          drengr devices

  refuses-unreachable-model:
    name: Refuses a model the runner cannot reach
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { provider: ollama, base-url: "" }
          - { provider: "",     base-url: "http://localhost:11434/v1" }
          - { provider: "",     base-url: "http://192.168.1.10:8000/v1" }
    steps:
      - uses: actions/checkout@v7
      - id: act
        continue-on-error: true
        uses: ./
        with:
          provider: ${{ matrix.provider }}
          base-url: ${{ matrix.base-url }}
      - name: Must have refused
        run: |
          [ "${{ steps.act.outcome }}" = "failure" ] \
            || { echo "an unreachable endpoint was accepted"; exit 1; }
