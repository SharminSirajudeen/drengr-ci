name: Drengr Mobile Tests
description: >-
  Run mobile app tests with Drengr on Android emulators and iOS simulators.
  Parses drengr-tests.yml, drives the device with an AI agent, and reports
  pass/fail as JSON or JUnit with GitHub annotations, evidence for every
  failure, and one comment on the pull request.

branding:
  icon: smartphone
  color: yellow

inputs:
  api-key:
    description: >-
      LLM API key used to drive the device. If omitted, whichever provider key is
      already in the job environment is used (DRENGR_API_KEY, GEMINI_API_KEY,
      OPENAI_API_KEY, ANTHROPIC_API_KEY, ...). One of these is required.
    required: false
    default: ""
  provider:
    description: LLM provider | gemini, openai, anthropic, groq, together, fireworks, ollama
    required: false
    default: ""
  model:
    description: Model to use. Defaults to the provider's built-in choice.
    required: false
    default: ""
  base-url:
    description: >-
      Any OpenAI-compatible endpoint (OpenRouter, LiteLLM, vLLM, your own gateway)
      to use instead of the provider's. Lets you run any model without waiting on
      Drengr to add a provider.
    required: false
    default: ""
  device:
    description: >-
      Where the device comes from. `auto` lets Drengr boot a headless emulator or
      simulator on the runner (Android needs KVM, iOS needs a macOS runner).
      `existing` attaches to a device something else already booted.
    required: false
    default: auto
  app:
    description: >-
      Build to install before the suite runs: the .apk this PR produced on
      Android, the .app on iOS. A runner's emulator starts empty, so without this
      every task fails on a missing app.
    required: false
    default: ""
  file:
    description: Path to drengr-tests.yml (auto-detected if omitted)
    required: false
    default: ""
  format:
    description: Output format | json, junit, or human
    required: false
    default: "json"
  output:
    description: File the results are written to (defaults by format; uploaded as the artifact)
    required: false
    default: ""
  evidence-dir:
    description: >-
      Folder that receives each task's screenshots, step trail, network calls and
      device log, plus summary.md for the suite. Uploaded with the results.
    required: false
    default: "drengr-evidence"
  scope-to-changes:
    description: >-
      On a pull request, run only the tasks whose `paths:` globs match a file the
      PR changed. Tasks without `paths:` always run. Ignored on other events.
    required: false
    default: "true"
  comment:
    description: >-
      On a pull request, post summary.md as one comment and update it in place on
      every run. The job needs `pull-requests: write`.
    required: false
    default: "true"
  github-token:
    description: Token used to list the PR's files and to post the comment.
    required: false
    default: ${{ github.token }}
  version:
    description: Version of the drengr npm package to install
    required: false
    default: "latest"
  artifact-name:
    description: Name for the results artifact
    required: false
    default: "drengr-results"
  artifact-retention:
    description: Days to retain the results artifact
    required: false
    default: "7"

outputs:
  passed:
    description: Number of passed tests
    value: ${{ steps.run.outputs.passed }}
  failed:
    description: Number of failed tests
    value: ${{ steps.run.outputs.failed }}
  total:
    description: Total test count
    value: ${{ steps.run.outputs.total }}
  results-file:
    description: Path to the results file
    value: ${{ steps.setup.outputs.results-file }}
  evidence-dir:
    description: Folder holding summary.md and one evidence folder per task
    value: ${{ inputs.evidence-dir }}
  artifact-url:
    description: URL of the uploaded results and evidence artifact
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Check the model endpoint is reachable from a runner
      run: |
        if [ "$PROVIDER" = "ollama" ] || [ "$PROVIDER" = "local" ]; then
          echo "provider '$PROVIDER' points at the machine running the job."
          echo "A hosted runner cannot reach a model on your laptop. Give base-url a"
          echo "reachable OpenAI-compatible endpoint, or run 'drengr test' locally."
          exit 2
        fi
        case "$BASE_URL" in
          *localhost*|*127.0.0.1*|*://10.*|*://192.168.*|*://172.1[6-9].*|*://172.2*|*://172.3[01].*)
            echo "base-url '$BASE_URL' is not reachable from a runner."
            echo "Use an endpoint the runner can resolve."
            exit 2 ;;
        esac
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        BASE_URL: ${{ inputs.base-url }}

    - uses: actions/setup-node@v7
      with:
        node-version: "22"

    - name: Install Drengr
      run: npm install -g "drengr@$VERSION"
      shell: bash
      env:
        VERSION: ${{ inputs.version }}

    - name: Resolve results path
      id: setup
      run: |
        if [ -z "$OUT" ]; then
          case "$FORMAT" in
            junit) OUT="drengr-results.xml" ;;
            json)  OUT="drengr-results.json" ;;
            *)     OUT="drengr-results.txt" ;;
          esac
        fi
        echo "results-file=$OUT" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        OUT: ${{ inputs.output }}
        FORMAT: ${{ inputs.format }}

    # The PR's file list, one path per line, for `drengr test --changed-files`.
    # A token that cannot read it is a warning, not a failure: the suite then
    # runs every task, which is the behaviour before this step existed.
    - name: List the files this pull request changed
      id: changed
      if: github.event_name == 'pull_request' && inputs.scope-to-changes == 'true'
      run: |
        out="$RUNNER_TEMP/drengr-changed-files.txt"
        : > "$out"
        page=1
        while [ "$page" -le 30 ]; do
          if ! body=$(curl -sS --fail -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API/repos/$REPO/pulls/$PR/files?per_page=100&page=$page"); then
            echo "::warning::could not list the pull request's files; running every task"
            rm -f "$out"
            exit 0
          fi
          printf '%s' "$body" | jq -r '.[].filename' >> "$out"
          [ "$(printf '%s' "$body" | jq 'length')" -lt 100 ] && break
          page=$((page + 1))
        done
        echo "file=$out" >> "$GITHUB_OUTPUT"
        echo "$(wc -l < "$out") changed file(s)"
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        API: ${{ github.api_url }}

    - name: Provide a device
      if: inputs.device != 'existing'
      run: drengr query setup --headless
      shell: bash

    - name: Run Drengr
      id: run
      run: |
        if [ -n "$API_KEY" ]; then export DRENGR_API_KEY="$API_KEY"; fi
        if [ -n "$PROVIDER" ]; then export DRENGR_VISION_PROVIDER="$PROVIDER"; fi
        if [ -n "$MODEL" ]; then export DRENGR_MODEL="$MODEL"; fi
        if [ -n "$BASE_URL" ]; then export DRENGR_BASE_URL="$BASE_URL"; fi
        ARGS=()
        if [ -n "$SUITE" ]; then ARGS+=("$SUITE"); fi
        if [ -n "$APP" ]; then ARGS+=(--app-file "$APP"); fi
        if [ -n "$CHANGED" ] && [ -f "$CHANGED" ]; then ARGS+=(--changed-files "$CHANGED"); fi
        drengr test "${ARGS[@]}" --format "$FORMAT" --output "$RESULTS_FILE" --evidence-dir "$EVIDENCE_DIR"
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        BASE_URL: ${{ inputs.base-url }}
        SUITE: ${{ inputs.file }}
        APP: ${{ inputs.app }}
        FORMAT: ${{ inputs.format }}
        RESULTS_FILE: ${{ steps.setup.outputs.results-file }}
        EVIDENCE_DIR: ${{ inputs.evidence-dir }}
        CHANGED: ${{ steps.changed.outputs.file }}

    - name: Upload results and evidence
      id: upload
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.setup.outputs.results-file }}
          ${{ inputs.evidence-dir }}
        if-no-files-found: warn
        retention-days: ${{ inputs.artifact-retention }}

    # One comment per PR, found again by its marker and updated in place, so a
    # PR with ten pushes carries one verdict, not ten. A token that cannot
    # comment is a warning: the verdict is still in the summary tab and the log.
    - name: Post the summary on the pull request
      if: always() && github.event_name == 'pull_request' && inputs.comment == 'true'
      run: |
        marker="<!-- drengr-ci -->"
        if [ ! -f "$SUMMARY" ]; then
          echo "no summary at $SUMMARY; nothing to post"
          exit 0
        fi
        body_file="$RUNNER_TEMP/drengr-comment.md"
        {
          echo "$marker"
          head -c 60000 "$SUMMARY"
          echo
          if [ -n "$ARTIFACT_URL" ]; then
            echo "Screenshots, trails and logs: [evidence artifact]($ARTIFACT_URL) · [run]($RUN_URL)"
          else
            echo "[run]($RUN_URL)"
          fi
        } > "$body_file"
        payload=$(jq -Rs '{body: .}' "$body_file")
        hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
        existing=""
        page=1
        while [ "$page" -le 10 ]; do
          comments=$(curl -sS --fail "${hdr[@]}" "$API/repos/$REPO/issues/$PR/comments?per_page=100&page=$page") || break
          existing=$(printf '%s' "$comments" | jq -r --arg m "$marker" '[.[] | select(.body | startswith($m))] | first | .id // empty')
          [ -n "$existing" ] && break
          [ "$(printf '%s' "$comments" | jq 'length')" -lt 100 ] && break
          page=$((page + 1))
        done
        if [ -n "$existing" ]; then
          curl -sS --fail -X PATCH "${hdr[@]}" "$API/repos/$REPO/issues/comments/$existing" -d "$payload" > /dev/null \
            && echo "updated comment $existing" \
            || echo "::warning::could not update the PR comment (the job needs pull-requests: write)"
        else
          curl -sS --fail -X POST "${hdr[@]}" "$API/repos/$REPO/issues/$PR/comments" -d "$payload" > /dev/null \
            && echo "posted the PR comment" \
            || echo "::warning::could not post the PR comment (the job needs pull-requests: write)"
        fi
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        API: ${{ github.api_url }}
        SUMMARY: ${{ inputs.evidence-dir }}/summary.md
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
